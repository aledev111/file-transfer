<!DOCTYPE html>
<html>
<head>
    <title>LiquidTransfer - Next Gen File Sharing</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 50%, #0a0f2a, #050814);
            overflow-x: hidden;
            position: relative;
        }

        /* Effetto liquid animato in background */
        .liquid-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 100, 150, 0.3), rgba(100, 50, 200, 0.2), rgba(0, 200, 255, 0.1));
            filter: blur(80px);
            animation: liquidMove 18s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes liquidMove {
            0% { transform: translate(0%, 0%) rotate(0deg); opacity: 0.6; }
            33% { transform: translate(5%, -8%) rotate(2deg); opacity: 0.8; }
            66% { transform: translate(-5%, 6%) rotate(-2deg); opacity: 0.5; }
            100% { transform: translate(0%, 0%) rotate(0deg); opacity: 0.6; }
        }

        /* Secondo strato liquid */
        .liquid-bg-2 {
            position: fixed;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(ellipse at 70% 60%, rgba(0, 255, 200, 0.2), rgba(255, 80, 120, 0.15));
            filter: blur(100px);
            animation: liquidMove2 25s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes liquidMove2 {
            0% { transform: translate(0%, 0%) scale(1); }
            50% { transform: translate(-6%, 5%) scale(1.1); }
            100% { transform: translate(0%, 0%) scale(1); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Effetto glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 48px 40px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Titolo con emoji animate */
        h1 {
            text-align: center;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a0c0ff, #ffaaee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .emoji-float {
            display: inline-block;
            animation: floatEmoji 3s ease-in-out infinite;
        }

        @keyframes floatEmoji {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(5deg); }
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* Upload area con effetto liquid */
        .upload-area {
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .upload-area.drag-over {
            border-color: #4cff9e;
            background: rgba(76, 255, 158, 0.1);
            transform: scale(1.03);
        }

        .upload-icon {
            font-size: 72px;
            margin-bottom: 20px;
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        }

        .upload-text {
            font-size: 1.6rem;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
        }

        .upload-hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        /* Progress bar liquid style */
        .progress-container {
            margin-top: 32px;
            display: none;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 60px;
            height: 40px;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .progress-fill {
            background: linear-gradient(90deg, #ff6a88, #ff99ac, #ff6a88);
            background-size: 200%;
            width: 0%;
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            border-radius: 60px;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0%; }
            100% { background-position: 200%; }
        }

        /* Result card */
        .result-card {
            margin-top: 32px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            animation: slideUp 0.5s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-info {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 24px;
            margin-bottom: 20px;
            color: white;
        }

        .link-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .link-input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 60px;
            font-size: 14px;
            background: rgba(255,255,255,0.9);
            font-family: monospace;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            font-size: 14px;
        }

        .btn-copy {
            background: linear-gradient(135deg, #4cff9e, #2ecc71);
            color: #1a2a1a;
        }

        .btn-copy:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(76, 255, 158, 0.3);
        }

        /* Sezione sponsor */
        .sponsors-section {
            margin-top: 60px;
            padding: 24px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .sponsors-title {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sponsors-grid {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .sponsor-item {
            background: rgba(255,255,255,0.08);
            padding: 12px 24px;
            border-radius: 60px;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .sponsor-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="liquid-bg"></div>
    <div class="liquid-bg-2"></div>

    <div class="container">
        <div class="glass-card">
            <h1>
                <span class="emoji-float">✨</span> LiquidTransfer 
                <span class="emoji-float">🚀</span>
            </h1>
            <div class="subtitle">
                <span>📡</span> Trasferimento file next-gen <span>⚡</span>
            </div>
            
            <div class="upload-area" id="dropZone">
                <div class="upload-icon">📤💎</div>
                <div class="upload-text">Trascina o clicca qui</div>
                <div class="upload-hint">🔥 Fino a 100MB • Tutti i formati • Crittografato 🔒</div>
                <input type="file" id="fileInput" hidden>
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
            </div>
            
            <div id="result"></div>
        </div>

        <!-- Sezione Sponsor -->
        <div class="sponsors-section">
            <div class="sponsors-title">
                <span>🤝</span> SPONSOR UFFICIALI <span>💎</span>
            </div>
            <div class="sponsors-grid">
                <div class="sponsor-item">⚡ HostPro Cloud</div>
                <div class="sponsor-item">🔐 SecureSend</div>
                <div class="sponsor-item">🚀 FastCDN</div>
                <div class="sponsor-item">💾 DataVault</div>
            </div>
        </div>

        <div class="footer">
            🌊 Effetto Liquid • 🎨 Design Premium • 🔗 Link sicuri
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const resultDiv = document.getElementById('result');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        
        dropZone.onclick = () => fileInput.click();
        
        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        };
        
        dropZone.ondragleave = () => {
            dropZone.classList.remove('drag-over');
        };
        
        dropZone.ondrop = async (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) await uploadFile(file);
        };
        
        fileInput.onchange = async (e) => {
            if (e.target.files[0]) await uploadFile(e.target.files[0]);
        };
        
        async function uploadFile(file) {
            resultDiv.innerHTML = '';
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            progressFill.textContent = '0%';
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                progressFill.style.width = '100%';
                progressFill.textContent = '100%';
                
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    
                    resultDiv.innerHTML = `
                        <div class="result-card">
                            <div style="text-align:center; font-size:48px; margin-bottom:12px;">🎉✨✅</div>
                            <div class="file-info">
                                <strong>📎 ${file.name}</strong><br>
                                📦 Dimensione: ${(file.size / 1024 / 1024).toFixed(2)} MB
                            </div>
                            <div class="link-container">
                                <input type="text" class="link-input" id="downloadLink" value="${data.link}" readonly>
                                <button class="btn btn-copy" onclick="copyLink()">📋 Copia link</button>
                            </div>
                            <div style="margin-top: 16px; text-align:center; font-size:13px; color:rgba(255,255,255,0.7);">
                                ⚡ Link valido finché server attivo • Condividi con chi vuoi 🔗
                            </div>
                        </div>
                    `;
                }, 500);
                
            } catch(error) {
                progressContainer.style.display = 'none';
                resultDiv.innerHTML = `
                    <div class="result-card" style="background:rgba(255,0,0,0.2);">
                        <div style="color:#ff8888;">❌ Errore nel caricamento. Riprova.</div>
                    </div>
                `;
            }
        }
        
        function copyLink() {
            const linkInput = document.getElementById('downloadLink');
            linkInput.select();
            document.execCommand('copy');
            
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✅ Copiato!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }
    </script>
</body>
</html>
